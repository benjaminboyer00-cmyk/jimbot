<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon.

    Même figure que la marque du bandeau : un niveau horizontal en pointillé,
    traversé par une progression en escalier qui s'achève sur un point. C'est
    littéralement ce que fait le moteur — placer un plan autour d'un niveau de
    structure — et c'est la seule forme du site qui tienne à 16 pixels.

    Les couleurs sont écrites en dur, contrairement à la marque du bandeau qui
    suit `currentColor` : une favicon n'hérite d'aucun style et doit tenir sur
    un onglet clair comme sur un onglet sombre. D'où la tuile graphite, qui
    porte son propre contraste au lieu de l'emprunter au navigateur.
  -->
  <rect width="32" height="32" rx="7" fill="#16181b"/>
  <path d="M5 20.5h22" stroke="#8b8d94" stroke-width="1.6" stroke-dasharray="3.2 3.2" stroke-linecap="round"/>
  <path d="M6 26l5-5.5 4.5 3.5L25 7.5" fill="none" stroke="#fbfbf9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="7.5" r="3" fill="#4fd08a"/>
</svg>

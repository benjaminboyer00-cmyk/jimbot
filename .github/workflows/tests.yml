name: Tests

on:
  push:
    paths: ["engine/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["engine/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt pytest
      - name: Tests unitaires
        # Les tests ne touchent aucun réseau : ils valident les mathématiques
        # sur données synthétiques, ce qui les rend déterministes.
        run: python -m pytest engine/tests -v

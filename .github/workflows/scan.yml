name: Scan de marché

on:
  schedule:
    # Toutes les 15 minutes. L'ordonnanceur GitHub est « au mieux » : sous
    # forte charge, une exécution peut être décalée de quelques minutes ou
    # sautée. Le moteur est idempotent, un cycle manqué est sans conséquence.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      no_alert:
        description: "Exécuter sans publier sur Discord"
        type: boolean
        default: false

# Un seul scan à la fois : deux exécutions concurrentes écriraient dans les
# mêmes fichiers JSON et produiraient un conflit de commit.
concurrency:
  group: jimbot-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Installer les dépendances
        run: pip install -r engine/requirements.txt

      - name: Scanner le marché
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIMBOT_SIGNAL_THRESHOLD: ${{ vars.JIMBOT_SIGNAL_THRESHOLD }}
          JIMBOT_ALERT_THRESHOLD: ${{ vars.JIMBOT_ALERT_THRESHOLD }}
          JIMBOT_PING_THRESHOLD: ${{ vars.JIMBOT_PING_THRESHOLD }}
          JIMBOT_PAPER_CAPITAL: ${{ vars.JIMBOT_PAPER_CAPITAL }}
        run: python engine/scan.py ${{ inputs.no_alert && '--no-alert' || '' }}

      - name: Publier les résultats
        run: |
          git config user.name  "jimbot"
          git config user.email "jimbot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "aucun changement à publier"
            exit 0
          fi
          git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Une autre exécution a pu committer entre-temps : on rejoue par
          # dessus au lieu d'échouer.
          for attempt in 1 2 3; do
            # -X theirs : en cas de conflit sur data/, on conserve les fichiers
            # qui viennent d'être générés. Ce sont des artefacts recalculés à
            # chaque exécution, jamais une source de vérité à préserver.
            git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "tentative $attempt échouée, nouvel essai"
            sleep 5
          done
          echo "::error::publication impossible après 3 tentatives"
          exit 1

name: Scan de marché

on:
  schedule:
    # Cadence déclarée : une fois par heure. Ce n'est PAS la cadence de scan,
    # qui reste de 15 minutes grâce à la boucle interne ci-dessous.
    #
    # Le choix vient d'une mesure, pas d'une préférence. Avec un cron
    # « */15 » la couverture réelle mesurée sur 71 heures a été de 4,2 % —
    # 12 scans au lieu de 285, avec un écart médian de 7 heures. GitHub
    # étrangle les planifications rapprochées, qui sont explicitement « au
    # mieux » et abandonnées en charge. Le rapport quotidien, lui, se
    # déclenchait normalement : ce sont bien les crons rapides qui sont visés.
    #
    # Une exécution horaire réalise donc quatre scans espacés de 15 minutes.
    # Même déclenchée avec deux heures de retard, elle couvre quatre points de
    # marché au lieu d'un seul.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      no_alert:
        description: "Exécuter sans publier sur Discord"
        type: boolean
        default: false

# Un seul scan à la fois : deux exécutions concurrentes écriraient dans les
# mêmes fichiers JSON et produiraient un conflit de commit.
concurrency:
  group: jimbot-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Installer les dépendances
        run: pip install -r engine/requirements.txt

      - name: Scanner le marché
        # Quatre scans espacés de 15 minutes, publiés au fil de l'eau : le
        # dashboard reste frais et l'historique garde une trace de chaque
        # passage. La boucle s'arrête d'elle-même avant la 55e minute pour ne
        # pas retenir le verrou de concurrence, que le rapport quotidien
        # partage.
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIMBOT_SIGNAL_THRESHOLD: ${{ vars.JIMBOT_SIGNAL_THRESHOLD }}
          JIMBOT_ALERT_THRESHOLD: ${{ vars.JIMBOT_ALERT_THRESHOLD }}
          JIMBOT_PING_THRESHOLD: ${{ vars.JIMBOT_PING_THRESHOLD }}
          JIMBOT_PAPER_CAPITAL: ${{ vars.JIMBOT_PAPER_CAPITAL }}
          # Raccordement courtier. Sans METAAPI_TOKEN, `broker.actif()` est
          # faux et rien ne part : le dépôt peut donc tourner tel quel chez
          # quelqu'un qui n'a pas de compte. JIMBOT_BROKER est une variable et
          # non un secret — c'est un interrupteur, pas une clé — de sorte qu'on
          # voit dans les réglages du dépôt si l'exécution est armée.
          JIMBOT_BROKER: ${{ vars.JIMBOT_BROKER }}
          JIMBOT_BROKER_MAX_POSITIONS: ${{ vars.JIMBOT_BROKER_MAX_POSITIONS }}
          JIMBOT_BROKER_TYPE: ${{ vars.JIMBOT_BROKER_TYPE }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_DEMO: ${{ vars.CAPITAL_DEMO }}
          # Sans cette variable, le moteur refuse tout compte que le courtier
          # ne declare pas comme compte de demonstration. C'est la ligne qui
          # separe « je passe des ordres depuis mon poste » de « un robot passe
          # des ordres pendant que je dors ».
          JIMBOT_BROKER_ALLOW_LIVE: ${{ vars.JIMBOT_BROKER_ALLOW_LIVE }}
          JIMBOT_RISK_MULT: ${{ vars.JIMBOT_RISK_MULT }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ACCOUNT_ID: ${{ secrets.METAAPI_ACCOUNT_ID }}
          METAAPI_REGION: ${{ vars.METAAPI_REGION }}
        run: |
          DEBUT=$(date +%s)
          OPTIONS="${{ inputs.no_alert && '--no-alert' || '' }}"
          for i in 1 2 3 4; do
            echo "::group::scan $i/4"
            python engine/scan.py $OPTIONS || echo "::warning::scan $i en échec, on continue"
            echo "::endgroup::"

            # Publication immédiate : un scan perdu vaut mieux qu'un lot perdu.
            git config user.name  "jimbot"
            git config user.email "jimbot@users.noreply.github.com"
            git add data/
            if ! git diff --staged --quiet; then
              git commit -q -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
              for tentative in 1 2 3; do
                git pull --rebase -X theirs --autostash -q origin "${GITHUB_REF_NAME}" \
                  && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
                sleep 5
              done
            fi

            [ "$i" = "4" ] && break
            ECOULE=$(( $(date +%s) - DEBUT ))
            # Marge de sécurité : on n'entame pas un cycle qui déborderait.
            [ "$ECOULE" -gt 2400 ] && { echo "temps écoulé, arrêt de la boucle"; break; }
            echo "attente de 15 minutes avant le scan suivant"
            sleep 900
          done

      - name: Vérifier qu'il ne reste rien à publier
        run: |
          # La boucle publie à chaque itération ; cette étape ne rattrape
          # qu'un éventuel reliquat.
          git add data/
          if git diff --staged --quiet; then
            echo "rien à publier"
            exit 0
          fi
          git commit -q -m "scan: reliquat $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs --autostash -q origin "${GITHUB_REF_NAME}" \
            && git push -q origin "HEAD:${GITHUB_REF_NAME}"
